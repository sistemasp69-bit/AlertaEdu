# AlertaEdu desplegable en Render: requiere repositorio GitHub y secretos en Dashboard.
services:
  - type: web
    name: alertaedu
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /healthz
    envVars:
      - key: ALERTAEDU_ENV
        value: production
      - key: ALERTAEDU_AUTH_PROVIDER
        value: supabase
      - key: SUPABASE_URL
        value: https://lwjnmebmotcnkjrhhbyl.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: ALERTAEDU_SEED_DEMO
        value: '0'
      - key: DATABASE_URL
        sync: false

# Configura el SMTP del proveedor de correo en Supabase Auth.
# Para enlaces de recuperación se usa RENDER_EXTERNAL_URL automáticamente.
# Si añades dominio personalizado, configura ALERTAEDU_BASE_URL=https://tu-dominio en Environment.
