# AlertaEdu desplegable en Render: requiere repositorio GitHub y secretos en Dashboard.
services:
  - type: web
    name: alertaedu
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /healthz
    envVars:
      - key: ALERTAEDU_ENV
        value: production
      - key: ALERTAEDU_AUTH_PROVIDER
        value: supabase
      - key: SUPABASE_URL
        value: https://lwjnmebmotcnkjrhhbyl.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: ALERTAEDU_SEED_DEMO
        value: '0'
      - key: ALERTAEDU_EMAIL_PROVIDER
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_EMAIL
        sync: false
      - key: BREVO_FROM_NAME
        value: AlertaEdu
      - key: DATABASE_URL
        sync: false
      - key: ALERTAEDU_BOOTSTRAP_TOKEN
        sync: false
      - key: ALERTAEDU_APPS_SCRIPT_URL
        sync: false
      - key: ALERTAEDU_APPS_SCRIPT_SECRET
        sync: false

# Para enlaces de recuperación se usa RENDER_EXTERNAL_URL automaticamente.
# Si añades dominio personalizado, configura ALERTAEDU_BASE_URL=https://tu-dominio en Environment.
