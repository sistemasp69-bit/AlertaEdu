<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AlertaEdu | Acceso seguro</title><style>
:root{font-family:system-ui,Segoe UI,sans-serif;color:#12213b;background:#f5f7fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(130deg,#e9f4ff,#f8faff 70%)}main{display:grid;grid-template-columns:1fr 1fr;max-width:880px;width:calc(100% - 32px);min-height:480px;background:white;border-radius:24px;box-shadow:0 22px 75px #1a33501b;overflow:hidden}.hero{background:#122f60;padding:50px;color:white;display:flex;flex-direction:column;justify-content:center}.hero h1{font-size:40px;margin:0}.hero p{line-height:1.7;color:#d2e1fd}.panel{padding:48px 38px;align-self:center}h2{font-size:26px;margin:0 0 8px}.muted{color:#64748b;margin:0 0 22px;line-height:1.5}label{display:block;font-size:13px;font-weight:700;margin:16px 0 7px}input{width:100%;padding:13px;border:1px solid #ccd7e5;border-radius:10px;font:inherit}button{font:inherit;cursor:pointer}button.primary{width:100%;border:0;border-radius:10px;background:#1557bb;color:white;padding:13px;margin-top:21px;font-weight:700}.links{margin-top:18px;display:flex;gap:12px;flex-wrap:wrap}.links button,.back{background:none;border:0;color:#1557bb;padding:3px}.notice{font-size:14px;line-height:1.5;margin:14px 0;color:#305071} .notice.error{color:#b42318}@media(max-width:700px){main{display:block;max-width:440px}.hero{padding:28px}.hero h1{font-size:29px}.panel{padding:30px}}
</style></head><body><main><section class="hero"><h1>AlertaEdu</h1><p>Sistema de detección temprana de deserción estudiantil utilizando inteligencia artificial.</p><small>Acceso institucional seguro</small></section><section class="panel"><h2 id="title">Iniciar sesión</h2><p class="muted" id="intro">Accede con tu correo verificado.</p><form id="form"><label for="email">Correo electrónico</label><input type="email" id="email" autocomplete="email" required><div id="password-block"><label for="password">Contraseña</label><input type="password" id="password" minlength="8" autocomplete="current-password" required></div><button class="primary" id="submit">Ingresar</button></form><p class="notice" id="notice" role="status" aria-live="polite"></p><div class="links"><button type="button" data-mode="register">Crear cuenta</button><button type="button" data-mode="forgot">¿Olvidaste tu contraseña?</button><button type="button" data-mode="login">Volver al inicio</button></div></section></main><script>
let mode='login';const $=id=>document.getElementById(id);document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;$('title').textContent={login:'Iniciar sesión',register:'Crear cuenta',forgot:'Recuperar contraseña'}[mode];$('submit').textContent={login:'Ingresar',register:'Registrarme',forgot:'Enviar enlace'}[mode];$('password-block').hidden=mode==='forgot';$('password').required=mode!=='forgot';$('notice').textContent='';});$('form').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;$('notice').textContent='Procesando solicitud…';$('notice').className='notice';try{const body={email:$('email').value.trim()};if(mode!=='forgot')body.password=$('password').value;const r=await fetch('/api/supabase/'+mode,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw Error(data.detail||'No fue posible continuar');$('notice').textContent=data.message||'Acceso autorizado';if(mode==='login')location.assign('/');}catch(err){$('notice').textContent=err.message;$('notice').className='notice error'}finally{$('submit').disabled=false}};
</script></body></html>
