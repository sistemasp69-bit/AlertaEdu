<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AlertaEdu | Nueva contraseña</title><style>body{font-family:system-ui;background:#eef4fb;color:#172b4d;display:grid;min-height:100vh;place-items:center;margin:0}main{background:white;padding:36px;border-radius:20px;max-width:420px;width:calc(100% - 36px);box-shadow:0 12px 40px #21365b21}input,button{box-sizing:border-box;width:100%;padding:13px;margin:10px 0;border-radius:9px;font:inherit}input{border:1px solid #b8c9da}button{background:#175ac0;color:white;border:0;cursor:pointer}p{line-height:1.5}a{color:#175ac0}</style></head><body><main><h1>AlertaEdu</h1><h2>Establecer nueva contraseña</h2><p id="message" role="status">Validando enlace de recuperación…</p><form id="form" hidden><label>Nueva contraseña<input type="password" id="password" minlength="12" required autocomplete="new-password"></label><label>Confirmar contraseña<input type="password" id="confirm" minlength="12" required autocomplete="new-password"></label><button>Actualizar contraseña</button></form><a href="/login">Volver a iniciar sesión</a></main><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const cfg=await fetch('/api/supabase/config').then(r=>r.json());const client=createClient(cfg.url,cfg.publishableKey,{auth:{detectSessionInUrl:true,persistSession:false,autoRefreshToken:false}});const msg=document.getElementById('message'),form=document.getElementById('form');
const hash=new URLSearchParams(location.hash.slice(1)),error=hash.get('error_description');if(error){msg.textContent='El enlace no es válido o ha expirado. Solicita uno nuevo.';}else{
const {data,error:sessionError}=await client.auth.getSession();if(sessionError||!data.session){msg.textContent='El enlace no es válido o ha expirado. Solicita uno nuevo.';}else{form.hidden=false;msg.textContent='Introduce una contraseña nueva de al menos 12 caracteres.';}}
form.onsubmit=async e=>{e.preventDefault();const p=document.getElementById('password').value;if(p!==document.getElementById('confirm').value){msg.textContent='Las contraseñas no coinciden';return;}const {error}=await client.auth.updateUser({password:p});if(error){msg.textContent='No se pudo cambiar la contraseña. Solicita un nuevo enlace.';return;}await client.auth.signOut();form.hidden=true;history.replaceState(null,'','/reset-password');msg.textContent='Contraseña actualizada correctamente. Ya puedes iniciar sesión.';};
</script></body></html>
